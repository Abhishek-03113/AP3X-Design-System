<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ojuju:wght@300;400&family=Fustat:wght@400&family=Spline+Sans+Mono:wght@400&family=Oooh+Baby&display=swap">
<style>

<body>
<dl><dt>Tue – Thu</dt><dd>5pm – 10pm</dd><dt>Fri – Sat</dt><dd>5pm – 11pm</dd><dt>Sunday</dt><dd>4pm – 9pm</dd></dl><p>Scottsdale, Arizona</p>
