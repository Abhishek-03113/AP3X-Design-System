<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aino</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=Schibsted+Grotesk:wght@400;500;700;800&display=swap">
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--paper); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }

  .ink{fill:var(--ink)} .t10{fill:var(--ink-10)}
  .blk{rx:var(--radius-sm)}
  .eq{stroke:var(--ink);stroke-width:2}

  .words { position:absolute; left:32px; bottom:28px; max-width:440px; }
  .name { margin:0; font-family:var(--font-mono); font-size:120px; line-height:0.95; font-weight:400; letter-spacing:0; color:var(--ink);  }
  .tag { margin:10px 0 0 2px; font-size:14px; line-height:20px; color:var(--ink-60); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
blocks      ink 192x192 slab bleeding off the right edge · ink-10 tint 144x240 behind it — one-ink brand, so two blocks
arrangement tint and slab overlapped, offset by space-4 (48)
pattern     the "=" rule line from the header: paired 2px strokes at a cell pitch, six runs, from "precise, technical, mono"
scales      cell 8px, space-4 48px, radius-sm 4px
-->
<rect class="t10 blk" x="144" y="24" width="192" height="240" rx="4"/>
<rect class="ink blk" x="288" y="72" width="200" height="168" rx="4"/>
<g class="eq">
<line x1="16" y1="40" x2="128" y2="40"/><line x1="16" y1="48" x2="128" y2="48"/>
<line x1="16" y1="104" x2="96" y2="104"/><line x1="16" y1="112" x2="96" y2="112"/>
<line x1="16" y1="168" x2="128" y2="168"/><line x1="16" y1="176" x2="128" y2="176"/>
<line x1="352" y1="24" x2="472" y2="24"/><line x1="352" y1="32" x2="472" y2="32"/>
</g>
</svg>
</div>
<div class="words">
<h1 class="name">Aino</h1>
<p class="tag">Design and technology, drawn in one ink.</p>
</div>
</div>
</body>
</html>
