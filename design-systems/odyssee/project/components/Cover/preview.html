<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Odyssée</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400&family=Albert+Sans:wght@400;500&display=swap">
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--cream); color:var(--navy); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }

  .navy{fill:var(--navy)} .clay{fill:var(--clay)} .char{fill:var(--charcoal)} .stone{fill:var(--stone)}
  .rule{stroke:var(--navy);stroke-width:1;fill:none}

  .words { position:absolute; left:32px; bottom:28px; max-width:440px; }
  .name { margin:0; font-family:var(--font-serif); font-size:112px; line-height:0.95; font-weight:300; letter-spacing:0; color:var(--navy);  }
  .tag { margin:10px 0 0 2px; font-size:14px; line-height:20px; color:var(--navy-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
blocks      navy 144x288 full-height slab · clay 96x192 · stone 120x144 · charcoal 48x48 — about 30% of 960x288
arrangement one tall navy slab with satellites, bottoms on one line, square corners (radius-none)
pattern     editorial hairlines: "borders not shadows", serif-led, so four 1px navy rules cross the blocks
scales      gutters space-3 (16), sides in space-5 (48) multiples, radius-none
-->
<rect class="stone" x="16" y="96" width="120" height="144"/>
<rect class="clay" x="152" y="48" width="96" height="192"/>
<rect class="navy" x="264" y="0" width="144" height="288"/>
<rect class="char" x="424" y="192" width="48" height="48"/>
<line class="rule" x1="0" y1="240.5" x2="480" y2="240.5"/>
<line class="rule" x1="0" y1="48.5" x2="248" y2="48.5"/>
<line class="rule" x1="136.5" y1="0" x2="136.5" y2="288"/>
<line class="rule" x1="424" y1="96.5" x2="480" y2="96.5"/>
</svg>
</div>
<div class="words">
<h1 class="name">Odyssée</h1>
<p class="tag">Medical aesthetics for timeless results.</p>
</div>
</div>
</body>
</html>
