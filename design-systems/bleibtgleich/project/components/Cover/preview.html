<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>bleibtgleich</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500&display=swap">
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--white); color:var(--black); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }

  .mi{fill:var(--mist)} .bk{fill:var(--black)}
  .ring{fill:none;stroke-width:2} .r1{stroke:var(--black)} .r2{stroke:var(--signal)}

  .words { position:absolute; left:32px; bottom:28px; max-width:440px; }
  .name { margin:0; font-family:var(--font-sans); font-size:72px; line-height:0.95; font-weight:500; letter-spacing:-3.6px; color:var(--black);  }
  .tag { margin:10px 0 0 2px; font-size:14px; line-height:20px; color:var(--black); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
blocks      mist tiles 72x72 ×4 (the project row) · black 1px vertical rule full height
arrangement one hairline divides the box; tiles sit either side at different heights, like the split hero
pattern     ring icons (radius-circle) inside the tiles, two black, two signal
scales      gap space-1 (8), tile 72, rule 1px
-->
<rect class="bk" x="160" y="0" width="1" height="288"/>
<rect class="mi" x="40" y="40" width="72" height="72"/>
<rect class="mi" x="200" y="120" width="72" height="72"/>
<rect class="mi" x="280" y="120" width="72" height="72"/>
<rect class="mi" x="360" y="200" width="72" height="72"/>
<circle class="ring r1" cx="76" cy="76" r="8"/>
<circle class="ring r2" cx="236" cy="156" r="8"/>
<circle class="ring r1" cx="316" cy="156" r="8"/>
<circle class="ring r2" cx="396" cy="236" r="8"/>
</svg>
</div>
<div class="words">
<h1 class="name">bleibtgleich</h1>
<p class="tag">the best ideas deserve execution.</p>
</div>
</div>
</body>
</html>
