<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flowlife</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400&display=swap">
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--snow); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }

  .ink{fill:var(--ink)} .mi{fill:var(--mist)} .sm{fill:var(--smoke)} .sa{fill:var(--sale)}
  .t{rx:var(--radius-md)}

  .words { position:absolute; left:32px; bottom:28px; max-width:440px; }
  .name { margin:0; font-family:var(--font-sans); font-size:96px; line-height:0.95; font-weight:400; letter-spacing:4px; color:var(--ink);  }
  .tag { margin:10px 0 0 2px; font-size:14px; line-height:20px; color:var(--ink); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
blocks      ink 200x288 (left photo half) · mist 200x288 (right half) · smoke 80x24 button · sale 32x12 flag
arrangement split-screen halves, as the homepage pairs two product photos
pattern     tiles cut by radius-md: two small smoke buttons centred on each half
scales      gutters space-3 (16), radius-md 4
-->
<rect class="ink" x="40" y="0" width="200" height="288"/>
<rect class="mi" x="240" y="0" width="240" height="288"/>
<rect class="sm t" x="100" y="160" width="80" height="24" rx="4"/>
<rect class="sm t" x="320" y="160" width="80" height="24" rx="4"/>
<rect class="sa t" x="432" y="24" width="32" height="12" rx="4"/>
</svg>
</div>
<div class="words">
<h1 class="name">Flowlife</h1>
<p class="tag">Recovery and performance systems from Scandinavia.</p>
</div>
</div>
</body>
</html>
