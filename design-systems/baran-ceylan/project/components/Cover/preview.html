<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Baran Ceylan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400&display=swap">
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--white); color:var(--black); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }

  .bk{fill:var(--black)} .hl{fill:var(--hairline)}
  .rule{stroke:var(--black);stroke-width:1}

  .words { position:absolute; left:32px; bottom:28px; max-width:440px; }
  .name { margin:0; font-family:var(--font-sans); font-size:72px; line-height:0.95; font-weight:400; letter-spacing:0; color:var(--black);  }
  .tag { margin:10px 0 0 2px; font-size:14px; line-height:20px; color:var(--black); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
blocks      black and hairline image tiles 72x96 alternating in two strips
arrangement two horizontal image strips edge to edge under rules, like the project rows
pattern     editorial: three 1px black rules marking rows
scales      gap space-1 (4), tiles 72x96
-->
<line class="rule" x1="0" y1="24.5" x2="480" y2="24.5"/>
<rect class="bk" x="0" y="36" width="72" height="96"/><rect class="hl" x="76" y="36" width="72" height="96"/><rect class="bk" x="152" y="36" width="72" height="96"/><rect class="hl" x="228" y="36" width="72" height="96"/><rect class="bk" x="304" y="36" width="72" height="96"/><rect class="hl" x="380" y="36" width="100" height="96"/>
<line class="rule" x1="0" y1="152.5" x2="480" y2="152.5"/>
<rect class="hl" x="0" y="164" width="72" height="96"/><rect class="bk" x="76" y="164" width="72" height="96"/><rect class="hl" x="152" y="164" width="72" height="96"/><rect class="bk" x="228" y="164" width="72" height="96"/><rect class="hl" x="304" y="164" width="176" height="96"/>
</svg>
</div>
<div class="words">
<h1 class="name">Baran<br>Ceylan</h1>
<p class="tag">Design and art direction, based in Basel.</p>
</div>
</div>
</body>
</html>
