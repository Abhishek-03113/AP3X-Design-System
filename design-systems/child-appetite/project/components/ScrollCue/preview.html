<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bayon&display=swap">
<style>
html,body{margin:0}
body{background:var(--midnight);padding:24px;display:grid;justify-items:center;gap:10px}
