<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Seventeen</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400&display=swap">
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--white); color:var(--black); font-family:var(--font-condensed); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }

  .r{fill:var(--brick)} .h{fill:var(--harbour)} .f{fill:var(--field)} .l{fill:var(--lime)} .u{fill:var(--umber)}

  .words { position:absolute; left:32px; bottom:28px; max-width:440px; }
  .name { margin:0; font-family:var(--font-condensed); font-size:96px; line-height:0.95; font-weight:400; letter-spacing:0; color:var(--black);  }
  .tag { margin:10px 0 0 2px; font-size:14px; line-height:20px; color:var(--black); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
blocks      brick 240x44 · harbour 192x44 · field 144x44 · lime 96x44 · umber 48x44 — the first spectrum bands
arrangement the site's own stepped stack: bands narrowing by a 48px step, centred, flush with no gap
pattern     the stair itself, from the brand's only device ("loud, bold" → stripes at a band pitch); five bands, no extra marks
scales      band height space-3 (44), step 48, radius-none
-->
<rect class="r" x="120" y="34" width="240" height="44"/>
<rect class="h" x="144" y="78" width="192" height="44"/>
<rect class="f" x="168" y="122" width="144" height="44"/>
<rect class="l" x="192" y="166" width="96" height="44"/>
<rect class="u" x="216" y="210" width="48" height="44"/>
</svg>
</div>
<div class="words">
<h1 class="name">Seventeen</h1>
<p class="tag">A creative agency.</p>
</div>
</div>
</body>
</html>
