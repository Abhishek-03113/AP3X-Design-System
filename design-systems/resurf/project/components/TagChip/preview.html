<!-- @dsCard group="Content" height=170 subtitle="Colour-coded, tilted" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap">
<style>
html,body{margin:0}
body{background:linear-gradient(var(--ground),var(--paper));padding:24px;font-family:var(--font-sans)}
.row{display:flex;flex-wrap:wrap;gap:14px 16px;align-items:center}
.c{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 18px;border-radius:var(--radius-pill);background:var(--paper);box-shadow:var(--shadow-chip);font:600 20px/1 var(--font-sans);letter-spacing:-.01em;color:var(--ink)}
.g{width:20px;height:20px;border-radius:6px;display:inline-block}
</style>
</head>
<body>
<div class="row"><span class="c" style="transform:rotate(-4deg);color:var(--amber-text)"><i class="g" style="background:var(--amber)"></i>Notes</span><span class="c" style="transform:rotate(2deg);color:var(--ember-text)"><i class="g" style="background:var(--ember)"></i>Voice notes</span><span class="c" style="transform:rotate(-6deg);color:var(--violet-text)"><i class="g" style="background:var(--violet)"></i>Links</span><span class="c" style="transform:rotate(5deg);color:var(--azure)"><i class="g" style="background:var(--azure)"></i>Screenshots</span><span class="c" style="transform:rotate(-2deg)"><i class="g" style="background:var(--ink)"></i>Images</span><span class="c" style="transform:rotate(4deg);color:var(--leaf-text)"><i class="g" style="background:var(--leaf)"></i>Videos</span></div>
</body>
</html>
