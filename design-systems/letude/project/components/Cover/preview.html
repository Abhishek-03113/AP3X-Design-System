<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>L'Étude</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--haze); color:var(--cobalt); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }

  .sig{fill:var(--signal)} .cob{fill:var(--cobalt)} .ink{fill:var(--ink)} .pap{fill:var(--paper)}
  .tile{rx:var(--radius-sm)}
  .ring{fill:none;stroke:var(--cobalt);stroke-width:3}

  .words { position:absolute; left:32px; bottom:28px; max-width:440px; }
  .name { margin:0; font-family:var(--font-sans); font-size:104px; line-height:0.95; font-weight:700; letter-spacing:-2.16px; color:var(--cobalt);  }
  .tag { margin:10px 0 0 2px; font-size:14px; line-height:20px; color:var(--ink); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
blocks      signal 240x288 bleeding off top and right · cobalt 144x112 · ink 64x64 — about 40% of the cover
arrangement modules floating on haze, as the site floats image tiles; one big red field
pattern     icon-badge rings (radius-pill) — the site's literal motif — six 40px circles in cobalt over haze and red
scales      tiles radius-sm (4px), gaps space-3 (16), badge 40px circle
-->
<rect class="sig" x="240" y="-8" width="248" height="304"/>
<rect class="cob tile" x="40" y="128" width="144" height="112" rx="4"/>
<rect class="ink tile" x="160" y="40" width="64" height="64" rx="4"/>
<circle class="ring" cx="64" cy="64" r="20"/>
<circle class="ring" cx="208" cy="168" r="20"/>
<circle class="ring" cx="300" cy="64" r="20"/>
<circle class="ring" cx="300" cy="112" r="20"/>
<circle class="cob" cx="420" cy="232" r="20"/>
<circle class="ring" cx="420" cy="184" r="20"/>
</svg>
</div>
<div class="words">
<h1 class="name">L'Étude</h1>
<p class="tag">Modular creative studio.</p>
</div>
</div>
</body>
</html>
